<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر قطع غيار السيارات - my-stor</title>
    <!-- مكتبة التنسيقات Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- رأس الصفحة -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-slate-900 p-2.5 rounded-xl font-black text-xl shadow-lg">
                    <i class="fa-solid fa-car-burst"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">my-stor</h1>
                    <p class="text-xs text-slate-400">منصة قطع غيار السيارات</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openAdminModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-sm font-semibold transition border border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-lock text-amber-500"></i>
                    <span>لوحة التحكم</span>
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي للمتجر -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- قسم العنوان والقطع المتاحة -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold flex items-center gap-2">
                <span data-i18n="available_parts">القطع المتاحة</span>
            </h2>
        </div>

        <!-- مؤشر التحميل -->
        <div id="loading-spinner" class="flex justify-center items-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-amber-500 border-t-transparent"></div>
        </div>

        <!-- شبكة عرض المنتجات -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- سيتم تعبئة المنتجات تلقائياً من قاعدة البيانات -->
        </div>

    </main>

    <!-- تذييل الصفحة -->
    <footer class="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            <p>&copy; 2026 my-stor. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <!-- نافذة لوحة التحكم للإدارة -->
    <div id="admin-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">إضافة منتج جديد</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-700">اسم القطعة</label>
                    <input type="text" id="product-name" class="w-full border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-700">النوع / الماركة</label>
                    <input type="text" id="product-brand" class="w-full border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-700">السعر (د.م)</label>
                    <input type="number" id="product-price" class="w-full border rounded-xl px-3 py-2 outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-700">صورة القطعة</label>
                    <input type="file" id="product-image" accept="image/*" class="w-full border rounded-xl px-3 py-2 text-sm">
                </div>
                <button id="publish-btn" onclick="submitNewProduct()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2.5 rounded-xl transition shadow-md">
                    نشر المنتج في المتجر
                </button>
            </div>
        </div>
    </div>

    <!-- سكربتات الاتصال بقاعدة البيانات Firebase وعرض المنتجات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ضع هنا إعدادات الاتصال الحقيقية الخاصة بمتجرك (Firebase Config)
     const firebaseConfig = {
            apiKey: "AIzaSyDOgSv7oK5Ioh-04vJk01UW7HknAPhCCcE",
            authDomain: "my-store-36560.firebaseapp.com",
            projectId: "my-store-36560",
            storageBucket: "my-store-36560.firebasestorage.app",
            messagingSenderId: "203056979017",
            appId: "1:203056979017:web:3519a99e971ad2dd947398",
            measurementId: "G-QRTDCSLDLB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // مجموعة قاعدة البيانات الموحدة والثابتة للمنتجات
        const productsCol = collection(db, "produits");

        // الاستماع الفوري لإضافة أو حذف المنتجات وتحديث الموقع لكل الزوار
        const q = query(productsCol, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const spinner = document.getElementById('loading-spinner');
            if (spinner) spinner.classList.add('hidden');

            const grid = document.getElementById('products-grid');
            grid.innerHTML = "";

            if (snapshot.empty) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">لا توجد منتجات مضافة حالياً.</div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition flex flex-col";
                card.innerHTML = `
                    <div class="h-48 bg-slate-100 overflow-hidden relative">
                        <img src="${p.image || 'https://via.placeholder.com/300'}" alt="${p.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <span class="text-xs font-semibold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-md w-fit mb-2">${p.brand || 'قطع غيار'}</span>
                        <h3 class="font-bold text-slate-800 text-lg mb-1">${p.name}</h3>
                        <div class="mt-auto pt-3 flex justify-between items-center border-t border-slate-100">
                            <span class="text-slate-900 font-extrabold text-lg">${p.price} د.م</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        });

        // دوال التحكم بالنافذة
        window.openAdminModal = function() {
            document.getElementById('admin-modal').classList.remove('hidden');
        }
        window.closeAdminModal = function() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        // دالة إضافة منتج جديد إلى قاعدة البيانات "produits"
        window.submitNewProduct = async function() {
            const name = document.getElementById('product-name').value;
            const brand = document.getElementById('product-brand').value;
            const price = document.getElementById('product-price').value;
            const fileInput = document.getElementById('product-image');
            const btn = document.getElementById('publish-btn');

            if (!name || !price) {
                alert('المرجو إدخال اسم المنتج والسعر على الأقل.');
                return;
            }

            btn.disabled = true;
            btn.innerText = "جاري الحفظ في السحابة...";

            try {
                let imageUrl = "";
                if (fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    imageUrl = await toBase64(file);
                }

                await addDoc(productsCol, {
                    name,
                    brand,
                    price: Number(price),
                    image: imageUrl,
                    createdAt: Date.now()
                });

                closeAdminModal();
                // إعادة تفريغ الحقول
                document.getElementById('product-name').value = "";
                document.getElementById('product-brand').value = "";
                document.getElementById('product-price').value = "";
                fileInput.value = "";
            } catch (error) {
                console.error("خطأ أثناء الإضافة:", error);
                alert("حدث خطأ أثناء رفع المنتج.");
            } finally {
                btn.disabled = false;
                btn.innerText = "نشر المنتج في المتجر";
            }
        };

        // مساعدة لتحويل الصورة إلى Base64
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
